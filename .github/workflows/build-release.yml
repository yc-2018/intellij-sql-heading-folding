name: 构建并发布插件

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 Gradle Wrapper 可执行权限
        run: chmod +x gradlew

      - name: 测试并构建插件
        run: ./gradlew test buildPlugin --stacktrace

      - name: 上传工作流构件
        uses: actions/upload-artifact@v4
        with:
          name: sql-heading-folding-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --stacktrace

      - name: 发布 continuous 预发行版
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            gh release delete continuous --cleanup-tag --yes
          fi

          gh release create continuous build/distributions/*.zip \
            --target "$GITHUB_SHA" \
            --title "Continuous build" \
            --notes "Automatically built from the latest commit on main." \
            --prerelease

      - name: 发布版本化 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
